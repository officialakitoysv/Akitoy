<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Formulario Enviado</title>
  <link rel="stylesheet" href="typography.css">
  <style>
  /* Variables */
  :root{ --bg:#FFFFFF; --text:#1F2937; --primary:#0F3D91; --primary-700:#0B3A7E; }
  /* Fondo general */
  body {
    background-color: var(--bg);
    font-family: Arial, sans-serif;
    margin: 0;
    padding: 0;
    color: var(--text);
  }

  /* Encabezado general */
  header {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 15px 20px;
    background-color: var(--primary);
    border-bottom: 2px solid var(--primary);
    box-shadow: 0 2px 8px rgba(30,103,198,0.25);
  }

  header img {
    width: 60px;
    height: 60px;
    margin-right: 15px;
  }

  header h1 { color: #fff; font-size: 24px; margin: 0; }

  /* Cuadro de confirmación */
  .confirm-box {
    position: relative;
    max-width: 500px;
    margin: 80px auto;
    padding: 50px 30px 30px 30px;
    border: 2px solid var(--primary);
    border-radius: 15px;
    background-color: #ffffff;
    text-align: center;
    box-shadow: 0 4px 18px rgba(30,103,198,0.12);
  }

  /* Logo en la parte superior del cuadro */
  .confirm-box::before {
    content: "";
    position: absolute;
    top: -30px;
    left: 50%;
    transform: translateX(-50%);
    width: 60px;
    height: 60px;
    background-image: url('logo toy.jpg'); /* Ajustada la ruta local */
    background-size: contain;
    background-repeat: no-repeat;
    background-position: center;
    border-radius: 50%;
    border: 2px solid var(--primary);
    box-shadow: 0 4px 12px rgba(30,103,198,0.25);
  }

  /* Texto dentro del cuadro */
  .confirm-box h2 { color: var(--primary); margin-bottom: 15px; font-size: 22px; }

  .confirm-box p { color: var(--text); margin-bottom: 25px; line-height: 1.5; }

  /* Botones dentro del cuadro */
  .confirm-box .button-group {
    display: flex;
    justify-content: space-between;
    gap: 15px;
  }

  .confirm-box button {
    flex: 1;
    padding: 12px;
    background: var(--primary);
    border: none;
    color: #fff;
    font-weight: bold;
    font-size: 16px;
    border-radius: 8px;
    cursor: pointer;
    transition: background 0.2s ease, box-shadow 0.3s ease, transform 0.1s ease;
  }

  .confirm-box button:hover {
    background: var(--primary-700);
    box-shadow: 0 6px 20px rgba(30,103,198,0.35);
    transform: translateY(-2px);
  }
  </style>
</head>
<body>

  <!-- Encabezado con logo y título -->
  <header>
    <img src="logo toy.jpg" alt="Logo AKITOY"> <!-- Reemplaza por tu logo -->
    <h1>AKITOY te espera</h1>
  </header>

  <!-- Cuadro de confirmación -->
  <div class="confirm-box">
    <h2>¡Formulario enviado correctamente!</h2>
    <p>Gracias por registrar tu emprendimiento. Ahora puedes elegir una de las siguientes opciones:</p>
    
    <div class="button-group">
      <button onclick="window.location.href='formulario confirma.html'">Regresar al formulario</button>
      <button onclick="window.location.href='menuu.html'">Visitar página como comprador</button>
      <button onclick="window.location.href='index.html'">cerrar ssión</button>
    </div>
  </div>

</body>
</html>
