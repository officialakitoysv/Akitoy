<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Akitoy - Inicio</title>
  <link rel="stylesheet" href="typography.css">
  <style>
/* Variables */
:root{ --bg:#FFFFFF; --text:#1F2937; --primary:#0F3D91; --primary-700:#0B3A7E; --primary-gradient: linear-gradient(90deg, #0F3D91 0%, #1E67C6 50%, #66A6FF 100%); }
/* ===================== */
/* General */
body {
  font-family: 'Montserrat', sans-serif;
  background-color: var(--bg);
  color: var(--text);
  margin: 0;
  padding: 0;
  display: flex;
  flex-direction: column;
  justify-content: flex-start;
  align-items: center;
  min-height: 100vh;
  text-align: center;
}

/* ===================== */
/* Barra superior */
#top-bar {
  width: 100%;
  background: var(--primary-gradient, linear-gradient(90deg, #0F3D91 0%, #1E67C6 50%, #66A6FF 100%));
  border-bottom: 2px solid var(--primary);
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 24px 0;
  box-shadow: 0 2px 8px rgba(30,103,198,0.25);
}

.top-text {
  color: #fff;
  font-size: 1.3rem;
  font-weight: bold;
  margin: 0;
}

/* ===================== */
/* Contenedor principal */
#container {
  background: #fff;
  border: 2px solid var(--primary);
  border-radius: 15px;
  padding: 60px 40px 40px 40px;
  max-width: 700px;
  width: 90%;
  margin-top: 60px;
  box-shadow: 0 4px 18px rgba(30,103,198,0.12);
  position: relative;
}

/* ===================== */
/* Logo centrado */
.logo-big {
  width: 80px;
  height: 80px;
  border: 2px solid var(--primary);
  border-radius: 50%;
  background-color: #ffffff;
  color: var(--primary);
  font-size: 0.9rem;
  font-weight: bold;
  display: flex;
  justify-content: center;
  align-items: center;
  position: absolute;
  top: -40px; /* mitad del tamaño del círculo */
  left: 50%;
  transform: translateX(-50%);
  box-shadow: 0 4px 14px rgba(30,103,198,0.25);
  text-transform: uppercase;
  z-index: 10;
}

/* Línea detrás del círculo */
#container::before {
  content: "";
  position: absolute;
  top: -2px; /* justo donde está el borde superior */
  left: 0;
  width: 100%;
  height: 2px;
  background: var(--primary);
  box-shadow: 0 0 8px rgba(30,103,198,0.35);
  z-index: 1;
}

/* ===================== */
/* Títulos */
h1 {
  font-size: 1.8rem;
  margin-top: 40px;
  margin-bottom: 15px;
  font-weight: bold;
  color: var(--primary);
}

.sub-text {
  font-size: 1rem;
  color: var(--text);
  margin-bottom: 30px;
}

/* ===================== */
/* Botones */
.btn-group {
  display: flex;
  justify-content: center;
  gap: 20px;
  flex-wrap: wrap;
}

.btn {
  background-color: var(--primary);
  color: white;
  padding: 14px 28px;
  border: none;
  border-radius: 8px;
  font-weight: bold;
  font-size: 1rem;
  text-decoration: none;
  box-shadow: 0 4px 14px rgba(30,103,198,0.25);
  transition: transform 0.2s ease, box-shadow 0.3s ease, background-color 0.2s ease;
}

.btn:hover {
  background-color: var(--primary-700);
  color: #fff;
  box-shadow: 0 6px 22px rgba(30,103,198,0.35);
  transform: translateY(-2px);
}

/* ===================== */
/* Responsive */
@media (max-width: 600px) {
  #container {
    padding: 40px 25px 25px 25px;
  }

  h1 {
    font-size: 1.5rem;
  }

  .btn {
    padding: 12px 20px;
    font-size: 0.9rem;
  }
}

/* Botón Cerrar Sesión */
.logout-btn {
  position: absolute;
  right: 20px;
  background: transparent;
  color: white;
  padding: 10px 18px;
  border-radius: 6px;
  font-weight: bold;
  text-decoration: none;
  font-size: 0.9rem;
  box-shadow: 0 4px 12px rgba(30,103,198,0.25);
  transition: all 0.3s ease;
  border: 1px solid rgba(255,255,255,0.85);
}

.logout-btn:hover {
  background: var(--primary-700);
  color: #fff;
  box-shadow: 0 6px 20px rgba(30,103,198,0.35);
}
  </style>
</head>
<body>
  <!-- Barra superior -->
 
  <div id="top-bar">
  <p class="top-text">AKITOY te espera</p>
</div>
  <br>

  <!-- Contenedor principal -->
  <div id="container">
    <div class="logo-big">AKITOY</div>
     <div class="logo-big">
  <img src="logo toy.jpg" alt="Logo Akitoy" style="width:120%; height:120%; border-radius:60%;">
</div>
    <h1>¿Cómo quiere ingresar a nuestra página?</h1>
    <p class="sub-text">
      Bienvenido a AKITOY: De salvadoreños, para salvadoreños.
    </p>

    <div class="btn-group">
      <a class="btn" href="el emprendedor elige si iniciar o registrarse.html">Ingresar como emprendedor</a>
      <a class="btn" href="El comprador decide si iniciar o registrarse.html">Ingresar como comprador</a>
    </div>
  </div>
</body>
</html>
